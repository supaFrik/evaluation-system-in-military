name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  TZ: "Asia/Ho_Chi_Minh"

jobs:
  test-and-analyze:
    name: Backend Test, JaCoCo Coverage & SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History (for SonarQube)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube cần toàn bộ git history để phân tích blame

      - name: Configure System Timezone (Hanoi - GMT+7)
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          date

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Backend Tests with JaCoCo Coverage
        run: |
          cd backend
          mvn clean test jacoco:report

      - name: Upload JaCoCo Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: SonarCloud Scan & Code Quality Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn sonar:sonar \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure System Timezone (Hanoi - GMT+7)
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          date

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: |
          cd frontend/my-app
          pnpm install --frozen-lockfile

      - name: Run Next.js Build
        env:
          TZ: "Asia/Ho_Chi_Minh"
          NEXT_PUBLIC_API_BASE_URL: "https://thidua.e335.vn/api/v1"
        run: |
          cd frontend/my-app
          pnpm run build

  deploy:
    name: Deploy to Private VPS via SSH
    needs: [test-and-analyze, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export TZ="Asia/Ho_Chi_Minh"
            cd /opt/military-emulation-system
            git pull origin main
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker system prune -f
