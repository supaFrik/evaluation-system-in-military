# Test Profile Configuration using H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:military_emulation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Context Path for tests
server.servlet.context-path=/api/v1

# JWT Configuration
jwt.secret=9a2f8c4e7b1d3f6a8e0c2b5d7e9f1a3c5b7d9e1f3a5c7b9e1f3a5c7b9e1f3a5c
jwt.expiration=86400000
jwt.refresh-expiration=604800000
